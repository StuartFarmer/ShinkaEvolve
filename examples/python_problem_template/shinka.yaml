max_evaluation_jobs: 2
max_proposal_jobs: 1
max_db_workers: 4
verbose: true
debug: false

db_config:
  db_path: evolution_db.sqlite
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
  migration_interval: 10
  migration_rate: 0.0
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted
  parent_selection_lambda: 10.0

job_config:
  time: null
  conda_env: null
  activate_script: null

evo_config:
  patch_types: [diff, full, cross]
  patch_type_probs: [0.6, 0.3, 0.1]
  num_generations: 20
  max_api_costs: null
  max_patch_resamples: 3
  max_patch_attempts: 2
  max_novelty_attempts: 3
  job_type: local
  language: python
  llm_models: ["gpt-5-mini", "gemini-3-flash-preview"]
  llm_kwargs:
    temperatures: [0.0, 0.5, 1.0]
    max_tokens: 16384
  meta_rec_interval: 10
  embedding_model: text-embedding-3-small
  code_embed_sim_threshold: 0.99
  init_program_path: initial.py
  llm_dynamic_selection: ucb
  llm_dynamic_selection_kwargs:
    cost_aware_coef: 0.5
  results_dir: results/python_problem_template
